syntax = "proto3";

package searcher;

import "bundle.proto";
import "packet.proto";

import "google/protobuf/timestamp.proto";

message SlotList {
  repeated uint64 slots = 1;
}

message SendBundleRequest {
  bundle.Bundle bundle = 1;

  // FLOWRA EXTENSION — dry run. The bundle is simulated and the full report is returned
  // inline, but it never enters the auction and is never broadcast, so nothing is spent and
  // nothing can land. Ignored by (and absent from) upstream Jito.
  //
  // - Bank: simulated on the block engine's RPC node, not the leader, at the commitment the
  //   engine is configured for. That bank trails the leader by a slot or more, so recent
  //   writes may be missing. If it lags too far, simulation is skipped (`simulation_skipped`).
  // - Signatures are not verified and each recent blockhash is replaced with the bank's.
  // - Counts against the key's submission rate limit (RESOURCE_EXHAUSTED when exceeded).
  bool simulate_only = 2;

  // FLOWRA EXTENSION — advisory simulation. The bundle is still simulated (verdict, logs and
  // pre/post account state are recorded and reported), but a failing simulation no longer
  // drops it: it enters the auction regardless and the validator's bundle stage — which
  // discards any reverting bundle atomically at block production — is the final arbiter.
  // For searchers whose edge outruns the simulation bank (see `simulate_only`). A skipped
  // simulation enters the auction with or without this flag. Precheck refusals (signature
  // already on chain, blockhash expired or expiring before the leader's slot) are certain,
  // not predictive, and still drop. Default false keeps the existing drop-on-failure
  // behaviour. Ignored by (and absent from) upstream Jito.
  bool skip_sim_drop = 3;
}

message SendBundleResponse {
  // server uuid for the bundle
  string uuid = 1;

  // FLOWRA EXTENSION — populated only when the request set `simulate_only`.
  // True if every transaction executed cleanly.
  bool simulated_ok = 2;
  // Bundle-level failure reason, as JSON; empty when `simulated_ok`.
  string simulation_err = 3;
  // Per-transaction detail in bundle order, up to and including the first failing
  // transaction: logs, units consumed, and the pre/post state of the accounts the
  // transaction write-locks (see bundle.SimulatedTransaction).
  repeated bundle.SimulatedTransaction simulation = 4;
  // Set when there is no verdict: the RPC was unavailable, or its bank was too far behind the
  // engine's tip. The bundle was neither proven good nor bad.
  bool simulation_skipped = 5;
}

message SubscribeBundleResultsRequest {}

message PendingTxSubscriptionRequest {
  // list of accounts to subscribe to
  // NOTE: the block-engine will only forward transactions that write lock the provided accounts here.
  repeated string accounts = 1;
}

message PendingTxNotification {
  // server-side timestamp the transactions were generated at (for debugging/profiling purposes)
  google.protobuf.Timestamp server_side_ts = 1;
  // expiration time of the packet
  google.protobuf.Timestamp expiration_time = 2;
  // list of pending transactions
  repeated packet.Packet transactions = 3;

  // FLOWRA EXTENSION — when the engine FIRST observed each transaction's signature, one
  // entry per element of `transactions` in the same order. Unlike `server_side_ts` (the
  // moment this delivery was forwarded, re-stamped on every repeat), this is preserved
  // across repeat deliveries of the same signature, so a searcher can compute how long a
  // transaction has been pending and skip ones likely already landed. Absent on older
  // engines; clients must tolerate an empty list. Ignored by upstream Jito.
  repeated google.protobuf.Timestamp first_seen = 4;
}

message NextScheduledLeaderRequest {}

message NextScheduledLeaderResponse {
  // the current slot the backend is on
  uint64 current_slot = 1;

  // the slot and identity of the next leader
  uint64 next_leader_slot = 2;
  string next_leader_identity = 3;
}

message ConnectedLeadersRequest {}

message ConnectedLeadersResponse {
  map<string, SlotList> connected_validators = 1;
}

message GetTipAccountsRequest {}

message GetTipAccountsResponse {
  repeated string accounts = 1;
}

service SearcherService {
  // RPC endpoint to subscribe to pending transactions. Clients can provide a list of base58 encoded accounts.
  // Any transactions that write-lock the provided accounts will be streamed to the searcher.
  rpc SubscribePendingTransactions (PendingTxSubscriptionRequest) returns (stream PendingTxNotification) {}

  rpc SendBundle (SendBundleRequest) returns (SendBundleResponse) {}

  // Streams the terminal fate of every bundle this searcher submits: rejected at simulation
  // (with the program's own error and logs), lost the auction, superseded by a bundle already
  // carrying one of its signatures, accepted, or processed in a block. Wire-compatible with
  // Jito's rpc of the same name.
  rpc SubscribeBundleResults (SubscribeBundleResultsRequest) returns (stream bundle.BundleResult) {}

  // Returns the next scheduled leader connected to the block engine.
  rpc GetNextScheduledLeader (NextScheduledLeaderRequest) returns (NextScheduledLeaderResponse) {}

  // Returns information on connected leader slots
  rpc GetConnectedLeaders (ConnectedLeadersRequest) returns (ConnectedLeadersResponse) {}

  // Returns the tip accounts searchers shall transfer funds to for the leader to claim.
  rpc GetTipAccounts (GetTipAccountsRequest) returns (GetTipAccountsResponse) {}
}
